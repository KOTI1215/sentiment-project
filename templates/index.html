<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Sentiment Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; color: #333; margin-bottom: 1.5rem; font-size: 1.6rem; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; resize: vertical; }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background: #0052a3; }
        .samples { display: flex; gap: 8px; margin: 10px 0; }
        .sample-btn { background: #eef2f5; color: #444; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; border: 1px solid #ddd; cursor: pointer; flex: 1; text-align: center; }
        .sample-btn:hover { background: #e2e8f0; }
        .result { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .positive { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .negative { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎬 Movie Review Sentiment</h1>
        <form method="POST" action="/predict">
            <textarea name="review" id="review" placeholder="Type or paste a movie review here..." required>{{ review if review else '' }}</textarea>
            
            <div class="samples">
                <span class="sample-btn" onclick="setReview('Masterpiece! Brilliant acting and incredible visuals.')">Try Positive</span>
                <span class="sample-btn" onclick="setReview('Terrible movie. Boring plot and terrible acting.')">Try Negative</span>
            </div>

            <button type="submit">Analyze Sentiment</button>
        </form>

        {% if sentiment %}
            <div class="result {{ 'positive' if sentiment == 'POSITIVE' else 'negative' }}">
                Sentiment: {{ sentiment }} ({{ confidence }}% confidence)
            </div>
        {% endif %}
    </div>

    <script>
        function setReview(text) {
            document.getElementById('review').value = text;
        }
    </script>
</body>
</html>
